name: Update HFlow stats

on:
  schedule:
    - cron: "0 0 * * *" # daily midnight UTC
  workflow_dispatch:
  # optional: also run when README markers change
  push:
    branches: [main]
    paths: [".github/scripts/update_hflow.py", ".github/workflows/update-hflow-stats.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update HFlow section in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_hflow.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update HFlow stats [skip ci]"
          git push
