<svg width="1280" height="300" viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <!-- ultra-subtle dot grid — 2% opacity, not the loud 40px grid before -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.9" fill="#21262D" opacity="1"/>
  </pattern>
</defs>

<!-- match GitHub's own canvas exactly — no vibe gradient -->
<rect width="1280" height="300" rx="12" fill="#0D1117"/>
<rect width="1280" height="300" rx="12" fill="url(#dots)" opacity="0.55"/>
<!-- hairline border — GitHub Primer border -->
<rect x="0.5" y="0.5" width="1279" height="299" rx="12" fill="none" stroke="#21262D" stroke-width="1"/>

<!-- eyebrow — left -->
<g transform="translate(40, 36)">
  <text x="0" y="0" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="500" letter-spacing="3.2" fill="#7D8590">METEORIC · AUDACIOUS · BUILDER</text>
</g>

<!-- status — right, Primer pill style, no neon -->
<g transform="translate(1062, 24)">
  <rect x="0" y="0" width="178" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="13" cy="12" r="4" fill="#3FB950"/>
  <text x="24" y="16" font-family="'SF Mono','JetBrains Mono',monospace" font-size="10" font-weight="600" letter-spacing="0.4" fill="#E6EDF3">HFlow · YC S26</text>
</g>

<!-- hairline -->
<line x1="40" y1="54" x2="1240" y2="54" stroke="#21262D" stroke-width="1" opacity="1"/>

<!-- NAME — single font, single weight, tight tracking — no serif/sans mix -->
<g transform="translate(40, 132)">
  <text x="0" y="0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="650" letter-spacing="-3.8" fill="#F0F6FC">Sagar Kharal</text>
</g>

<!-- role line -->
<g transform="translate(40, 166)">
  <text x="0" y="0" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="400" letter-spacing="-0.2" fill="#8B949E">Engineer @ <tspan fill="#E6EDF3" font-weight="550">Hebbian Robotics</tspan> — AI agents, evaluation &amp; robotics data</text>
  <text x="0" y="22" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11.5" font-weight="400" letter-spacing="0.15" fill="#7D8590">HFlow · MCAP · Airflow · DuckDB · 23 PRs · 8 issues · pre-v1, shipping weekly</text>
</g>

<!-- bottom rule + mono footer -->
<g transform="translate(40, 252)">
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#21262D" stroke-width="1"/>
  <text x="0" y="20" font-family="'SF Mono','JetBrains Mono',monospace" font-size="9.5" font-weight="400" letter-spacing="1.6" fill="#484F58">AI AGENTS — EVALUATION — VERIFICATION — FULL-STACK</text>
  <text x="1200" y="20" font-family="'SF Mono','JetBrains Mono',monospace" font-size="9.5" font-weight="500" letter-spacing="1.2" fill="#7D8590" text-anchor="end">sagar-kharal.vercel.app — remote (india)</text>
</g>
</svg>
